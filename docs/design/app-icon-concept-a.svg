<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 暖奶茶底座垂直渐变 -->
    <linearGradient id="milkTeaBgA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5E8D6"/>
      <stop offset="50%" stop-color="#EEDAC0"/>
      <stop offset="100%" stop-color="#E2C7A3"/>
    </linearGradient>

    <!-- 窗口微妙阴影 -->
    <filter id="studioShadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8C7965" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8C7965" flood-opacity="0.12"/>
    </filter>

    <!-- 云朵投影 -->
    <filter id="cloudShadowA" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#9E8770" flood-opacity="0.18"/>
    </filter>

    <!-- 终端渐变 -->
    <linearGradient id="consoleBgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#23272F"/>
      <stop offset="100%" stop-color="#181B20"/>
    </linearGradient>

    <!-- 芽绿渐变 -->
    <linearGradient id="sproutGradA" x1="0" y1="1" x2="0.6" y2="0">
      <stop offset="0%" stop-color="#3D6A4B"/>
      <stop offset="60%" stop-color="#5B8F6B"/>
      <stop offset="100%" stop-color="#96C77F"/>
    </linearGradient>
  </defs>

  <!-- 1. macOS 标准应用圆角底座 Squircle -->
  <rect x="100" y="100" width="824" height="824" rx="200" fill="url(#milkTeaBgA)" stroke="#D8BE9B" stroke-width="2.5"/>
  <rect x="103" y="103" width="818" height="818" rx="197" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="3"/>

  <!-- 2. 底托：经典橦云白云（稳重托底） -->
  <g id="cloud" filter="url(#cloudShadowA)" fill="#FCF4E1">
    <rect x="260" y="626" width="504" height="136" rx="68"/>
    <circle cx="355" cy="626" r="92"/>
    <circle cx="468" cy="600" r="128"/>
    <circle cx="582" cy="612" r="108"/>
    <circle cx="652" cy="630" r="70"/>
    <circle cx="704" cy="644" r="62"/>
  </g>

  <!-- 3. 工作台视窗主体 (Studio Bento Console) -->
  <g id="workbench-window" filter="url(#studioShadowA)">
    <!-- 窗口白色主外壳 -->
    <rect x="228" y="236" width="568" height="376" rx="36" fill="#FFFDF9" stroke="#E6DCCB" stroke-width="3"/>

    <!-- 窗口顶栏与控制点 -->
    <line x1="228" y1="294" x2="796" y2="294" stroke="#EDE4D6" stroke-width="2.5"/>
    <circle cx="270" cy="265" r="7.5" fill="#EF8F7B"/> <!-- 蜜桃红点 -->
    <circle cx="294" cy="265" r="7.5" fill="#E6CFAE"/> <!-- 奶茶黄点 -->
    <circle cx="318" cy="265" r="7.5" fill="#6E9A5A"/> <!-- 抹茶绿点 -->

    <!-- 工作台标题微标 -->
    <rect x="468" y="258" width="88" height="14" rx="7" fill="#EFE8DC"/>

    <!-- [左分栏] 项目文件树 (Files & Project Workspace) -->
    <g id="sidebar">
      <rect x="248" y="312" width="132" height="280" rx="20" fill="#F4EFE6"/>
      <!-- 当前选中高亮项目 (抹茶绿) -->
      <rect x="258" y="328" width="112" height="42" rx="12" fill="#4D7C5D"/>
      <!-- 项目运行小指示箭头 -->
      <polygon points="274,342 274,356 286,349" fill="#FCF4E1"/>
      <rect x="294" y="345" width="64" height="8" rx="4" fill="#FCF4E1"/>

      <!-- 文件树节点项 -->
      <g fill="#D6C8B1">
        <circle cx="274" cy="396" r="4.5" fill="#8B6E3C"/>
        <rect x="286" y="392" width="76" height="8" rx="4"/>
        
        <circle cx="274" cy="420" r="4.5" fill="#3E6F9E"/>
        <rect x="286" y="416" width="62" height="8" rx="4"/>

        <circle cx="274" cy="444" r="4.5" fill="#C2593F"/>
        <rect x="286" y="440" width="82" height="8" rx="4"/>

        <rect x="270" y="468" width="90" height="8" rx="4" fill="#E2D5C3"/>
        <rect x="270" y="492" width="70" height="8" rx="4" fill="#E2D5C3"/>
        <rect x="270" y="516" width="84" height="8" rx="4" fill="#E2D5C3"/>
      </g>
    </g>

    <!-- [右上分栏] 终端与运行控制台 (Dev / Run Console) -->
    <g id="terminal-panel">
      <rect x="394" y="312" width="382" height="152" rx="20" fill="url(#consoleBgA)" stroke="#333842" stroke-width="2"/>
      <!-- 提示符 >_ 与命令流 -->
      <path d="M 420 346 L 436 358 L 420 370" fill="none" stroke="#96C77F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="448" y="347" width="14" height="22" rx="3.5" fill="#96C77F"/>
      <rect x="474" y="354" width="96" height="8" rx="4" fill="#94A3B8"/>
      
      <!-- 输出日志流动 -->
      <rect x="420" y="392" width="220" height="7.5" rx="3.75" fill="#68D391" opacity="0.85"/>
      <rect x="420" y="412" width="300" height="7.5" rx="3.75" fill="#64748B"/>
      <rect x="420" y="432" width="160" height="7.5" rx="3.75" fill="#3E6F9E"/>
    </g>

    <!-- [右下左] 接口与数据 (API & Database Module) -->
    <g id="api-db-panel">
      <rect x="394" y="478" width="184" height="114" rx="20" fill="#FAF6EE" stroke="#E6DCCB" stroke-width="2"/>
      <!-- API REST 药丸标签 -->
      <rect x="412" y="494" width="58" height="22" rx="7" fill="#C2593F"/>
      <text x="441" y="509" fill="#FFFDF9" font-family="-apple-system, system-ui, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">API</text>
      <!-- 数据网格层级 -->
      <rect x="478" y="501" width="84" height="8" rx="4" fill="#4D7C5D"/>
      <rect x="412" y="530" width="150" height="7" rx="3.5" fill="#D6C8B1"/>
      <rect x="412" y="548" width="120" height="7" rx="3.5" fill="#E6DCCB"/>
      <rect x="412" y="566" width="140" height="7" rx="3.5" fill="#E6DCCB"/>
    </g>

    <!-- [右下右] Git 版本流 (Git Workflow Module) -->
    <g id="git-panel">
      <rect x="592" y="478" width="184" height="114" rx="20" fill="#FAF6EE" stroke="#E6DCCB" stroke-width="2"/>
      <!-- 分支曲线与节点 -->
      <path d="M 632 574 L 632 506" stroke="#4D7C5D" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      <path d="M 632 552 C 632 524 676 534 676 508 L 676 498" stroke="#EF8F7B" stroke-width="5.5" stroke-linecap="round" fill="none"/>
      
      <!-- 主分支节点 (抹茶绿) -->
      <circle cx="632" cy="506" r="9.5" fill="#FFFDF9" stroke="#4D7C5D" stroke-width="5"/>
      <circle cx="632" cy="566" r="9.5" fill="#FFFDF9" stroke="#4D7C5D" stroke-width="5"/>
      <!-- 特性分支节点 (蜜桃红) -->
      <circle cx="676" cy="498" r="9.5" fill="#FFFDF9" stroke="#EF8F7B" stroke-width="5"/>

      <!-- 提交信息指示线 -->
      <rect x="700" y="495" width="60" height="7.5" rx="3.75" fill="#EF8F7B"/>
      <rect x="700" y="515" width="48" height="7.5" rx="3.75" fill="#A4C48C"/>
      <rect x="652" y="562" width="76" height="7.5" rx="3.75" fill="#4D7C5D"/>
    </g>
  </g>

  <!-- 4. 生机之源：突破视窗向上舒展的「云芽」 -->
  <g id="brand-sprout" filter="url(#studioShadowA)">
    <!-- 芽主干与叶片 -->
    <path d="M 752 260
             C 745 230 730 205 700 185
             C 665 162 620 166 614 167
             C 610 188 620 226 655 250
             C 685 270 724 268 752 260 Z"
          fill="url(#sproutGradA)"/>
    <!-- 嫩芽幼叶 -->
    <path d="M 735 250
             C 755 235 780 225 802 230
             C 812 233 816 242 810 252
             C 796 270 765 276 735 250 Z"
          fill="#A4C48C"/>
    <!-- 叶脉高光 -->
    <path d="M 622 173 C 655 205 690 238 732 254"
          fill="none" stroke="#FCF4E1" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>